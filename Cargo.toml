[package]
name = "visales"
version = "0.1.16"
edition = "2024"
default-run = "visales"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "wgpu"] }
egui_extras = "0.31.1"
rusqlite = { version = "0.34", features = ["bundled"] }
anyhow = "1"
prost = "0.14"
tokio = { version = "1", features = ["rt"] }
tonic = { version = "0.14", default-features = false, features = ["transport", "tls-webpki-roots"] }
tonic-prost = "0.14"
argon2 = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }
calamine = "0.38"
rust_xlsxwriter = "0.104"

[target.'cfg(not(target_os = "android"))'.dependencies]
eframe = { version = "0.31.1", default-features = false, features = ["x11", "wayland"] }

[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "0.31.1", default-features = false, features = ["android-native-activity"] }
winit = { version = "0.30", features = ["android-native-activity"] }
jni = "0.22"
ndk = "0.9"

[package.metadata.android]
package = "ua.visales.app"
build_targets = ["aarch64-linux-android"]
apk_name = "ViSales"

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 34

[package.metadata.android.application]
label = "ViSales"
extract_native_libs = true
has_code = true

[package.metadata.android.application.activity]
name = "ua.visales.app.ScannerActivity"

[[package.metadata.android.uses_permission]]
name = "android.permission.CAMERA"

[[package.metadata.android.uses_feature]]
name = "android.hardware.camera"
required = false

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[[package.metadata.android.uses_permission]]
name = "android.permission.REQUEST_INSTALL_PACKAGES"
