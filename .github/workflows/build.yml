name: Build ViSales

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked
      - run: cargo build --locked --release --bin visales
      - uses: actions/upload-artifact@v4
        with:
          name: ViSales-Windows-x64
          path: target/release/visales.exe
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0' 'ndk;27.2.12479018'
      - run: echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - run: cargo install cargo-apk --version 0.10.0 --locked
      - run: cargo apk build --lib
      - uses: actions/upload-artifact@v4
        with:
          name: ViSales-Android-arm64
          path: target/debug/apk/ViSales.apk
          if-no-files-found: error
